[package]
name = "glossql-import"
version = "0.1.0"
edition.workspace = true

[lib]
name = "glossql_import"
path = "src/lib.rs"

[dependencies]
datafusion = { workspace = true }
futures = "0.3"
serde_json = { workspace = true }
# try_to_date/try_to_timestamp parse with the same chrono arrow already uses.
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
