[package]
name = "glossql-scripts"
version = "0.1.0"
edition.workspace = true

[dependencies]
glossql-glossary = { path = "../glossary" }
glossql-session = { path = "../session" }
datafusion.workspace = true
serde_json.workspace = true
# `sync` because the runtime lives in an Arc<dyn FunctionRuntime: Send+Sync>
# and shares compiled ASTs across threads; `serde` is the JSON bridge both
# ways (rhai-1.25.1: ast.rs:19, serde/ser.rs:83).
rhai = { version = "1.25", features = ["sync", "serde"] }
regex = "1"

[dev-dependencies]
glossql-catalog = { path = "../catalog" }
tokio.workspace = true
tempfile = "3"
