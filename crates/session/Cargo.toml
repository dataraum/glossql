[package]
name = "glossql-session"
version = "0.1.0"
edition.workspace = true

[dependencies]
glossql-parser = { path = "../parser" }
glossql-glossary = { path = "../glossary" }
glossql-catalog = { path = "../catalog" }
glossql-import = { path = "../import" }
datafusion.workspace = true
datafusion-functions-json.workspace = true
serde_json.workspace = true
