[workspace]
resolver = "3"
members = [
    "crates/parser",
    "crates/catalog",
    "crates/glossary",
    "crates/scripts",
    "crates/import",
    "crates/serverd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

# The version lattice is governed by iceberg-rust's DataFusion integration:
# it moves when iceberg-datafusion moves, never unilaterally.
# (datafusion 54.1 <-> arrow/parquet 58 <-> iceberg 0.10.)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
datafusion = "54"
datafusion-functions-json = "0.54"
arrow = "58"
parquet = "58"
arrow-flight = { version = "58", features = ["flight-sql-experimental"] }
iceberg = "0.10"
iceberg-datafusion = "0.10"
iceberg-catalog-sql = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "json"] }
rhai = "1"
jsonschema = "0.49"
rmcp = "3"
adbc_core = "0.24"

[profile.release]
lto = "thin"
